name: Smoke test

# Builds the image for one app release, checks it against the cnspec policy and
# deploys k8s/ to a throwaway kind cluster. Called by CI (with the tag currently
# in the manifest) and by Publish (with the newly released tag, before anything
# is pushed), so an image that fails the policy never reaches the registry.

on:
  workflow_call:
    inputs:
      tag:
        description: App release tag, e.g. v1.2.3
        required: true
        type: string

permissions:
  contents: read

env:
  KIND_NODE_IMAGE: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  # The image checks in policies/hello-mondoo.mql.yaml look for this tag.
  LOCAL_IMAGE: hello-mondoo:smoke

jobs:
  kind:
    name: kind (${{ inputs.tag }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Fetch and verify release
        env:
          TAG: ${{ inputs.tag }}
        run: bash scripts/fetch-release.sh "$TAG"

      - name: Build image
        run: docker buildx build --platform linux/amd64 --load -t "$LOCAL_IMAGE" .

      - uses: ./.github/actions/setup-cnspec

      # Scan a created (never started) container instead of the image itself.
      # cnspec scans it from a docker export snapshot, which can read both the
      # filesystem and, through the Docker engine, the image config (exposed
      # ports, entrypoint, user). A plain image scan can't see the config, and
      # a running container can't be stat'ed because distroless has no shell.
      - name: Scan image (cnspec)
        env:
          SARIF_OUT: cnspec-container.sarif
          SARIF_FILE: Dockerfile
        run: |
          cid=$(docker create "$LOCAL_IMAGE")
          trap 'docker rm "$cid" >/dev/null' EXIT
          bash scripts/cnspec-scan.sh docker container "$cid"

      # These findings have no file in the repo to point at, so they are kept
      # as an artifact instead of going to code scanning.
      - name: Keep container scan report
        if: always() && hashFiles('cnspec-container.sarif') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cnspec-container-${{ inputs.tag }}
          path: cnspec-container.sarif
          retention-days: 30

      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: smoke
          node_image: ${{ env.KIND_NODE_IMAGE }}

      - name: Load image into kind
        run: kind load docker-image "$LOCAL_IMAGE" --name smoke

      - name: Deploy
        run: |
          mkdir -p rendered
          cp k8s/*.yaml rendered/
          # Swap the registry image for the one we just built. Everything else
          # in the manifest is applied exactly as committed.
          sed -i -E "s#^(\s*image: ).*hello-mondoo.*#\1${LOCAL_IMAGE}#" rendered/10-deployment.yaml
          grep -n 'image:' rendered/10-deployment.yaml
          kubectl apply -f rendered/
          kubectl -n hello-mondoo rollout status deployment/hello-mondoo --timeout=120s

      - name: Check response
        run: |
          kubectl -n hello-mondoo port-forward svc/hello-mondoo 18080:80 >/dev/null 2>&1 &
          pf=$!
          trap 'kill "$pf"' EXIT
          for _ in $(seq 1 20); do
            if body=$(curl -fs http://127.0.0.1:18080/); then
              echo "$body"
              [ "$body" = "Hello from Mondoo Engineer!" ] && exit 0
              echo "unexpected response" >&2
              exit 1
            fi
            sleep 1
          done
          echo "service did not respond" >&2
          exit 1

      - name: Debug info
        if: failure()
        run: |
          kubectl -n hello-mondoo get all -o wide || true
          kubectl -n hello-mondoo describe deployment,replicaset,pods || true
          kubectl -n hello-mondoo get events --sort-by=.lastTimestamp || true
          kubectl -n hello-mondoo logs -l app.kubernetes.io/name=hello-mondoo --tail=50 || true
