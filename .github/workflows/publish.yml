name: Publish

# Triggered by the app repo after every release (repository_dispatch), or by
# hand to rebuild a given tag. Flow:
#   resolve tag -> smoke test -> build, push and sign -> bump k8s manifest

on:
  repository_dispatch:
    types: [app-released]
  workflow_dispatch:
    inputs:
      tag:
        description: App release tag to publish, e.g. v1.2.3
        required: true
        type: string

permissions: {}

# One publish at a time, never cancelled, so manifest bumps can't race.
concurrency:
  group: publish
  cancel-in-progress: false

env:
  IMAGE: docker.io/clickbg/hello-mondoo

jobs:
  resolve:
    name: Resolve tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - id: tag
        env:
          # Untrusted: comes from the dispatch payload or a form field.
          RAW_TAG: ${{ github.event.client_payload.tag || inputs.tag }}
        run: |
          if [[ ! "$RAW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "error: '$RAW_TAG' is not a semver tag" >&2
            exit 1
          fi
          version="${RAW_TAG#v}"
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          {
            echo "tag=$RAW_TAG"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing $RAW_TAG (prerelease: $prerelease)" >> "$GITHUB_STEP_SUMMARY"

  smoke-test:
    name: Smoke test
    needs: resolve
    permissions:
      contents: read
    uses: ./.github/workflows/smoke-test.yml
    with:
      tag: ${{ needs.resolve.outputs.tag }}

  publish:
    name: Build, push and sign
    needs: [resolve, smoke-test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dockerhub
    permissions:
      contents: read
      id-token: write # keyless cosign signing
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Fetch and verify release
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: bash scripts/fetch-release.sh "$TAG"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.resolve.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.resolve.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.resolve.outputs.tag }},enable=${{ !startsWith(needs.resolve.outputs.tag, 'v0.') }}
            type=raw,value=latest,enable=${{ needs.resolve.outputs.prerelease == 'false' }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true

      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          CERT_IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify \
            --certificate-identity "$CERT_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}" > /dev/null
          {
            echo "### Image"
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  bump-manifest:
    name: Bump k8s manifest
    needs: [resolve, publish]
    if: needs.resolve.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push the manifest change to main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true # needed for the push below; job only has contents: write

      - name: Update image reference
        id: bump
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          MANIFEST: k8s/10-deployment.yaml
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "error: unexpected digest '$DIGEST'" >&2
            exit 1
          fi

          current=$(sed -nE 's#^\s*image: docker\.io/clickbg/hello-mondoo:([^@[:space:]]+).*#\1#p' "$MANIFEST")
          # Compare release versions only, so a stable release always wins over
          # its own release candidates.
          newest=$(printf '%s\n%s\n' "${current%%-*}" "$VERSION" | sort -V | tail -1)
          if [[ "$newest" != "$VERSION" ]]; then
            echo "Manifest is on $current, newer than $VERSION. Leaving it alone." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          sed -i -E "s#^(\s*image: ).*hello-mondoo.*#\1${IMAGE}:${VERSION}@${DIGEST}#" "$MANIFEST"
          if git diff --quiet; then
            echo "Manifest already points at ${VERSION}@${DIGEST}." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.bump.outputs.changed == 'true'
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: hello-mondoo ${TAG}" -m "Image built, smoke-tested and signed in ${RUN_URL}"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push attempt ${attempt} failed, retrying" >&2
            sleep 5
          done
          exit 1
