apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-mondoo
  namespace: hello-mondoo
  labels:
    app.kubernetes.io/name: hello-mondoo
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-mondoo
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello-mondoo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hello-mondoo
          # Updated by the publish workflow on every release.
          image: docker.io/clickbg/hello-mondoo:0.1.1@sha256:d913ebb107f22b4f36112eb4e834587f8a782a05840a4155061b08e60f99c803
          imagePullPolicy: IfNotPresent
          env:
            # Change together with containerPort below.
            - name: HTTP_PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
